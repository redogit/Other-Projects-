name: FIRE Music Dance Android

on:
  pull_request:
    paths:
      - "android/fire-music-dance/**"
      - "Decision Field Operator Lab/live-fire-field/**"
      - ".github/workflows/fire-music-dance-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify local-only Android contract
        working-directory: android/fire-music-dance
        run: python verify_project.py

      - name: Build debug APK
        working-directory: android/fire-music-dance
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FIRE-Music-Dance-debug-apk
          path: android/fire-music-dance/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
