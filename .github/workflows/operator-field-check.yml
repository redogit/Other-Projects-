name: Decision Field Operator Lab

on:
  push:
    branches: [main]
    paths:
      - 'Decision Field Operator Lab/**'
      - '.github/workflows/operator-field-check.yml'
  pull_request:
    paths:
      - 'Decision Field Operator Lab/**'
      - '.github/workflows/operator-field-check.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: operator-field-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact verification commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERIFY_SHA"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$VERIFY_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$VERIFY_SHA"

      - name: Run exact bounded tests
        run: python3 -m unittest discover -s "Decision Field Operator Lab" -p "test_*.py" -v

      - name: Verify committed operator-field evidence is reproducible
        run: python3 "Decision Field Operator Lab/run_audit.py" --check

      - name: Verify GSFL operator projection evidence is reproducible
        run: python3 "Decision Field Operator Lab/run_gsfl_operator_audit.py" --check

      - name: Verify GSFL bidirectional macro evidence is reproducible
        run: python3 "Decision Field Operator Lab/run_gsfl_bidirectional_audit.py" --check

      - name: Verify contextual multicarrier reasoning evidence is reproducible
        run: python3 "Decision Field Operator Lab/run_contextual_multicarrier_audit.py" --check

      - name: Verify RMAPL Omega conditional repair evidence is reproducible
        run: python3 "Decision Field Operator Lab/run_rmapl_omega_audit.py" --check
