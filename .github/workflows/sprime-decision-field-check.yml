name: SPrime Decision Field

on:
  push:
    branches: [main, sprime-decision-field-pass06]
    paths:
      - 'SPrime Search/decision-field/**'
      - '.github/workflows/sprime-decision-field-check.yml'
  pull_request:
    paths:
      - 'SPrime Search/decision-field/**'
      - '.github/workflows/sprime-decision-field-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprime-decision-field-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Materialize exact commit
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Re-run bounded decision-field audits
        shell: bash
        run: |
          set -euo pipefail
          cd "SPrime Search/decision-field"
          python3 audit.py
          python3 stress_audit.py

      - name: Verify committed evidence is reproducible
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- "SPrime Search/decision-field/evidence"
