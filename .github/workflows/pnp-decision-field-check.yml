name: Verify P-vs-NP decision-field checkpoint

on:
  pull_request:
    paths:
      - 'P versus NP Repair Lab/decision_field/**'
      - 'P versus NP Repair Lab/mlir/**'
      - '.github/workflows/pnp-decision-field-check.yml'
      - 'PUBLIC_RELEASE_APPROVAL.json'
  push:
    branches: [main]
    paths:
      - 'P versus NP Repair Lab/decision_field/**'
      - 'P versus NP Repair Lab/mlir/**'
      - '.github/workflows/pnp-decision-field-check.yml'
      - 'PUBLIC_RELEASE_APPROVAL.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: other-projects-pnp-decision-field-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Materialize exact verification commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERIFY_SHA"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$VERIFY_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$VERIFY_SHA"

      - name: Re-run bounded circuit discriminator and checkpoint invariants
        shell: bash
        run: |
          set -euo pipefail
          cd "P versus NP Repair Lab/decision_field/discriminators_2026_09_14"
          python3 test_discriminators.py
          python3 -m py_compile experiment_a_symmetry.py experiment_b_consequence.py
          if find . -maxdepth 1 -type f -name 'SAT64*.zip' -print -quit | grep -q .; then
            echo 'Owner-held SAT64 archives must not be published in this checkpoint.' >&2
            exit 1
          fi

      - name: Verify post-merge selector records and claim ceilings
        shell: bash
        run: |
          set -euo pipefail
          cd "P versus NP Repair Lab/decision_field"
          python3 -m py_compile consequence_selector_k4.py one_feedback_round_selector.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          df = json.loads((root / 'DF_PNP_01_RESULT.json').read_text())
          k4 = json.loads((root / 'CONSEQUENCE_SELECTOR_K4_RESULT.json').read_text())
          one = json.loads((root / 'ONE_FEEDBACK_ROUND_SELECTOR_RESULT.json').read_text())

          assert df['experiment'] == 'DF-PNP-01'
          assert df['status'] == 'EXECUTED_F2_FINITE_CALIBRATION_PLUS_SEPARATE_F2_PROOF'
          assert 'not the constrained F_5 SAT64 guard domain' in df['scope']
          assert df['sat64_translation_status'].startswith('METHOD_CALIBRATION_ONLY')
          assert 'no P-vs-NP conclusion' in df['claim_ceiling']
          assert 'No Hodge evidence imported' in df['claim_ceiling']

          assert k4['experiment'] == 'DF-PNP-02-CONSEQUENCE-SELECTOR-K4'
          assert k4['status'] == 'EXECUTED_BOUNDED_NEGATIVE_RESULT'
          assert k4['baseline_replay']['historical_state_counts_reproduced_exactly'] is True
          baseline = {r['name']: r for r in k4['baseline_replay']['all_original']}
          for row in k4['consequence_k4']:
              assert row['name'] in baseline
              assert row['states'] == baseline[row['name']]['states']
              assert row['planning_branch_probes'] > 0
              assert row['planning_row_operations'] > 0
          assert 'not a P-versus-NP result' in k4['claim_ceiling']
          assert 'No Hodge evidence is used' in k4['claim_ceiling']

          assert one['experiment'] == 'DF-PNP-03-ONE-FEEDBACK-ROUND-SELECTOR'
          assert one['status'] == 'EXECUTED_BOUNDED_NEGATIVE_RESULT'
          one_base = {r['name']: r for r in one['baseline_all_original']}
          one_rows = {r['name']: r for r in one['one_round_k8']}
          assert one_rows['compiler_0']['states'] > one_base['compiler_0']['states']
          assert one_rows['compiler_0']['maximum_depth'] > one_base['compiler_0']['maximum_depth']
          assert one_rows['compiler_1']['states'] == one_base['compiler_1']['states']
          assert 'balanced controls were not adaptively run' in one['scope_boundary']
          assert 'No P-vs-NP conclusion' in one['claim_ceiling']
          assert 'no Hodge evidence transfer' in one['claim_ceiling']

          for doc in (
              'AFFINE_COORDINATE_BRANCHING_THEOREM.md',
              'ORIGINAL_PARTITION_INVARIANCE.md',
              'SUCCINCT_AFFINE_CANDIDATE_FRONTIER.md',
          ):
              text = (root / doc).read_text(encoding='utf-8')
              assert text.strip(), doc

          print('PASS - post-merge P-vs-NP records are bounded, negative results remain negative, and evidence domains stay separated')
          PY

      - name: Ensure private SAT64 archives are not published anywhere in decision-field surface
        shell: bash
        run: |
          set -euo pipefail
          if find "P versus NP Repair Lab/decision_field" -type f -name 'SAT64*.zip' -print -quit | grep -q .; then
            echo 'Owner-held SAT64 archives must remain outside the public repository.' >&2
            exit 1
          fi

      - name: Hold protected publication boundary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pnp-decision-field-check.yml').read_text(encoding='utf-8')
          forbidden = (
              'git' + ' push ' + '--force',
              'git' + ' push ' + '-f',
          )
          for token in forbidden:
              if token in workflow:
                  raise SystemExit(f'forbidden direct publication mutation remains: {token}')
          print('PASS - verifier is non-mutating; publication requires protected PR flow')
          PY
          {
            echo '### P-vs-NP publication handoff'
            echo "- verified source revision: \`$VERIFY_SHA\`"
            echo '- public projection: held unless `PUBLIC_RELEASE_APPROVAL.json` explicitly approves the exact reviewed revision'
            echo '- publication path: owner safety review → exact revision approval → separately reviewable public projection change'
            echo '- this workflow has `contents: read` and does not mutate protected branches'
          } >> "$GITHUB_STEP_SUMMARY"

  pnp-mlir-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLVM_VERSION: '23.1.1'
      LLVM_SOURCE_SHA256: 'ebe9be46fe8756d58c5b198ffad0fa2a766257add81a4dc52179bfacc7888ee6'
      LLVM_SOURCE_URL: 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/llvm-project-23.1.1.src.tar.xz'
    steps:
      - name: Materialize exact verification commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERIFY_SHA"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$VERIFY_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$VERIFY_SHA"

      - name: Verify frozen Python parity first
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s "P versus NP Repair Lab/mlir/test/python" -v
          python3 -m py_compile \
            "P versus NP Repair Lab/mlir/python/freeze_parity_manifest.py" \
            "P versus NP Repair Lab/mlir/python/emit_legacy_mlir.py" \
            "P versus NP Repair Lab/mlir/python/check_parity.py"

      - name: Fetch exact LLVM and MLIR source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pnp-llvm-src"
          archive="$RUNNER_TEMP/pnp-llvm-src/llvm-project-${LLVM_VERSION}.src.tar.xz"
          curl --fail --location --retry 3 --output "$archive" "$LLVM_SOURCE_URL"
          printf '%s  %s\n' "$LLVM_SOURCE_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP/pnp-llvm-src"
          test -d "$RUNNER_TEMP/pnp-llvm-src/llvm-project-${LLVM_VERSION}.src/llvm"

      - name: Configure exact LLVM and MLIR toolchain
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/pnp-llvm-src/llvm-project-${LLVM_VERSION}.src"
          build="$RUNNER_TEMP/pnp-llvm-build"
          cmake -S "$src/llvm" -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=mlir \
            -DLLVM_TARGETS_TO_BUILD=Native \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DMLIR_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DMLIR_ENABLE_BINDINGS_PYTHON=OFF
          cmake --build "$build" --parallel 2 --target \
            llvm-config llvm-tblgen mlir-tblgen MLIROptLib MLIRIR FileCheck not count
          test "$("$build/bin/llvm-config" --version)" = "$LLVM_VERSION"
          test -f "$build/lib/cmake/llvm/LLVMConfig.cmake"
          test -f "$build/lib/cmake/mlir/MLIRConfig.cmake"

      - name: Build and test PNP MLIR foundation
        shell: bash
        run: |
          set -euo pipefail
          llvm_build="$RUNNER_TEMP/pnp-llvm-build"
          cmake -S "P versus NP Repair Lab/mlir" -B build/pnp-mlir -G Ninja \
            -DLLVM_DIR="$llvm_build/lib/cmake/llvm" \
            -DMLIR_DIR="$llvm_build/lib/cmake/mlir"
          cmake --build build/pnp-mlir --parallel 2 --target pnp-opt check-pnp-mlir
          python3 -m unittest discover -s "P versus NP Repair Lab/mlir/test/python" -v

      - name: Preserve evidence boundary in CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('P versus NP Repair Lab/mlir/README.md').read_text(encoding='utf-8')
          assert 'MLIR parity is a representation/migration result, not evidence for P=NP or P!=NP.' in text
          assert 'UNKNOWN != 0' in text
          assert 'TEMPORAL_SIGNAL != PROOF' in text
          print('PASS - MLIR parity gate retains the P-vs-NP claim ceiling')
          PY
