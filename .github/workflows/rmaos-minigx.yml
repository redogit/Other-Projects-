name: RMAOS MiniGX
on:
  pull_request:
    paths:
      - "RMAOS MiniGX/**"
      - ".github/workflows/rmaos-minigx.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify MiniGX compiler and contracts
        working-directory: RMAOS MiniGX
        run: |
          python VERIFY.py
          python -m unittest -v toolchain/test_minigxc.py
      - name: Install GLSL validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools
      - name: Validate MiniGX shaders
        working-directory: RMAOS MiniGX
        run: |
          glslangValidator -S vert shaders/fullscreen.vert
          glslangValidator -S frag shaders/fermat_fire.frag
      - name: Build native RMAOS MiniGX APK
        working-directory: RMAOS MiniGX/android/rmaos-minigx
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RMAOS-MiniGX-Five-Eyes-Fermat-FIRE-debug-apk
          path: RMAOS MiniGX/android/rmaos-minigx/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
