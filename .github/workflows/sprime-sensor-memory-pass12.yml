name: SPrime Sensor Memory Pass 12

on:
  push:
    branches: [main]
    paths:
      - 'SPrime Search/decision-field/sensor-memory/**'
      - '.github/workflows/sprime-sensor-memory-pass12.yml'
  pull_request:
    paths:
      - 'SPrime Search/decision-field/sensor-memory/**'
      - '.github/workflows/sprime-sensor-memory-pass12.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: sprime-sensor-memory-pass12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Materialize exact verification commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERIFY_SHA"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$VERIFY_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$VERIFY_SHA"
          python3 --version
          g++ --version

      - name: Re-run admitted Pass 11 objective monitor twice
        shell: bash
        run: |
          set -euo pipefail
          src="SPrime Search/decision-field/objective-monitor"; tmp="$(mktemp -d)"
          python3 "$src/audit.py" --out "$tmp/run1"
          python3 "$src/audit.py" --out "$tmp/run2"
          cmp "$tmp/run1/SUMMARY.json" "$tmp/run2/SUMMARY.json"
          cmp "$tmp/run1/VERIFICATION.json" "$tmp/run2/VERIFICATION.json"
          python3 - "$tmp/run1/SUMMARY.json" <<'PY'
          import json, subprocess, sys
          fresh=json.load(open(sys.argv[1]))
          committed=json.loads(subprocess.check_output(['git','show','HEAD:SPrime Search/decision-field/objective-monitor/evidence/SUMMARY.json']))
          assert fresh == committed and fresh['status'] == 'PASS_BOUNDED'
          assert fresh['systems_with_monitor_collision'] == 48_822
          print('PASS inherited Pass 11 objective-monitor evidence')
          PY

      - name: Re-run Pass 12 sensor-memory census twice
        shell: bash
        run: |
          set -euo pipefail
          src="SPrime Search/decision-field/sensor-memory"; tmp="$(mktemp -d)"
          python3 "$src/audit.py" --out "$tmp/run1"
          python3 "$src/audit.py" --out "$tmp/run2"
          cmp "$tmp/run1/SUMMARY.json" "$tmp/run2/SUMMARY.json"
          cmp "$tmp/run1/VERIFICATION.json" "$tmp/run2/VERIFICATION.json"
          python3 - "$tmp/run1/SUMMARY.json" "$tmp/run1/VERIFICATION.json" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          fresh=json.load(open(sys.argv[1])); ver=json.load(open(sys.argv[2]))
          committed=json.loads(subprocess.check_output(['git','show','HEAD:SPrime Search/decision-field/sensor-memory/evidence/SUMMARY.json']))
          committed_ver=json.loads(subprocess.check_output(['git','show','HEAD:SPrime Search/decision-field/sensor-memory/evidence/VERIFICATION.json']))
          assert fresh == committed
          assert ver == committed_ver
          assert fresh['status'] == 'PASS_BOUNDED'
          assert fresh['systems'] == 16_384 and fresh['sensor_cases'] == 114_688
          assert fresh['memoryless_winning_sensor_cases'] == 62_032
          assert fresh['two_state_memory_winning_sensor_cases'] == 74_344
          assert fresh['memory_rescued_sensor_cases'] == 12_312
          assert fresh['systems_with_memory_rescue'] == 3_528
          assert fresh['rescues_by_profile'] == {'2+2':4656,'3+1':7656}
          assert fresh['witness']['partition'] == [0,0,0,1]
          assert fresh['witness']['controller_code'] == 3
          assert ver['native_replays_identical'] is True and ver['python_native_exact_match'] is True
          src=Path('SPrime Search/decision-field/sensor-memory')
          for name,expected in ver['source_sha256'].items():
              assert hashlib.sha256((src/name).read_bytes()).hexdigest() == expected
          print('PASS deterministic Pass 12 sensor-memory evidence and exact source hashes')
          PY
