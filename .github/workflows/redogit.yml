name: REDOGIT Other Projects

on:
  push:
    branches: [main]
    paths:
      - 'redogit.json'
      - 'tools/verify.py'
      - 'PROJECT_ROUTING.md'
      - 'Human Expression Archive/**'
      - 'S1024 Compression Lab/**'
      - 'evidence/**'
      - 'knowledge-garden/**'
      - 'server.ts'
      - '.github/workflows/redogit.yml'
  pull_request:
    paths:
      - 'redogit.json'
      - 'tools/verify.py'
      - 'PROJECT_ROUTING.md'
      - 'Human Expression Archive/**'
      - 'S1024 Compression Lab/**'
      - 'evidence/**'
      - 'knowledge-garden/**'
      - 'server.ts'
      - '.github/workflows/redogit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: redogit-other-projects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch exact verification commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERIFY_SHA"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$VERIFY_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$VERIFY_SHA"

      - name: Verify contract, lineage boundaries, archive, and S1024
        run: python3 tools/verify.py

      - name: Verify Knowledge Garden compiler, recovery, aspects, and deployment entry
        shell: bash
        run: |
          set -euo pipefail
          node --version
          cd knowledge-garden
          npm test
          npm run build
          node server.mjs --check-catalog
          cd ..
          node --check server.ts
