name: RMAOS MiniGX
on:
  pull_request:
    paths: ["RMAOS MiniGX/**",".github/workflows/rmaos-minigx.yml","tools/hodge_dependency.py","dependencies/hodge.lock.json"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    env: { ANDROID_SDK_ROOT: /usr/local/lib/android/sdk }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head and fetch pinned canonical Hodge inputs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 tools/hodge_dependency.py fetch
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Verify compiler, contracts, fuzz and Java state stress
        working-directory: RMAOS MiniGX
        run: |
          python3 VERIFY.py
          python3 -m unittest discover -v -s toolchain -p 'test*.py'
          python3 toolchain/stress_minigxc.py --cases 5000
          rm -rf /tmp/minigx-java && mkdir -p /tmp/minigx-java/src/org/rmaos/mingx/generated /tmp/minigx-java/classes
          CIRCUIT="$(python3 ../tools/hodge_dependency.py path w114_circuit)"
          python3 toolchain/minigxc.py "$CIRCUIT" --out /tmp/minigx-java/graph.json --java /tmp/minigx-java/src/org/rmaos/mingx/generated/MiniGXGraph.java
          javac -d /tmp/minigx-java/classes /tmp/minigx-java/src/org/rmaos/mingx/generated/MiniGXGraph.java android/rmaos-minigx/app/src/main/java/org/rmaos/mingx/MiniGXGameState.java toolchain/MiniGXGameStateStress.java
          java -cp /tmp/minigx-java/classes org.rmaos.mingx.MiniGXGameStateStress
      - name: Install GLSL validator
        run: sudo apt-get update -qq && sudo apt-get install -y glslang-tools
      - name: Validate MiniGX shaders
        working-directory: RMAOS MiniGX
        run: |
          glslangValidator -S vert shaders/fullscreen.vert
          glslangValidator -S frag "$(python3 ../tools/hodge_dependency.py path w114_shader)"
      - name: Build native RMAOS MiniGX APK
        working-directory: RMAOS MiniGX/android/rmaos-minigx
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify packaged source parity
        working-directory: RMAOS MiniGX
        run: python3 toolchain/hodge_assets.py parity android/rmaos-minigx/app/build/outputs/apk/debug/app-debug.apk
      - name: Package exact MiniGX source
        run: tar --exclude='*/__pycache__' --exclude='*/build' --exclude='*/.gradle' -czf RMAOS-MiniGX-source.tgz "RMAOS MiniGX" .github/workflows/rmaos-minigx.yml tools/hodge_dependency.py dependencies/hodge.lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: RMAOS-MiniGX-source
          path: RMAOS-MiniGX-source.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RMAOS-MiniGX-W114-Perturbation-debug-apk
          path: RMAOS MiniGX/android/rmaos-minigx/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
