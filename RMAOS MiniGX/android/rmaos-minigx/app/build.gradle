plugins { id 'com.android.application' }
android {
    namespace 'org.rmaos.mingx'; compileSdk 35
    defaultConfig { applicationId 'org.rmaos.mingx'; minSdk 33; targetSdk 35; versionCode 8; versionName '0.8.0-minigx' }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { java.srcDir "$buildDir/generated/minigx/java"; assets.srcDir "$buildDir/generated/minigx/assets" } }
}
def miniGXRoot=file('../../..'),generatedRoot=file("$buildDir/generated/minigx")
def repositoryRoot=miniGXRoot.parentFile
def dependencyResolver=file("$repositoryRoot/tools/hodge_dependency.py")
def resolveHodgeArtifact={ key ->
    // Explicit provisioning is required. Resolution verifies the pin and checksum.
    def path=providers.exec {
        commandLine 'python3',dependencyResolver,'path',key
    }.standardOutput.asText.get().trim()
    file(path)
}
def canonicalCircuit=resolveHodgeArtifact('w114_circuit'),canonicalShader=resolveHodgeArtifact('w114_shader')
tasks.register('generateMiniGX',Exec) {
    inputs.files canonicalCircuit,canonicalShader,dependencyResolver,file("$repositoryRoot/dependencies/hodge.lock.json"),file("$miniGXRoot/toolchain/minigxc.py"),file("$miniGXRoot/toolchain/hodge_assets.py"),file("$miniGXRoot/shaders/fullscreen.vert")
    outputs.dirs file("$generatedRoot/assets"),file("$generatedRoot/java")
    commandLine 'python3',file("$miniGXRoot/toolchain/hodge_assets.py"),'build','--generated-root',generatedRoot
}
tasks.named('preBuild').configure { dependsOn tasks.named('generateMiniGX') }
